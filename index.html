<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Can you guess My Favorite?</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
  <style>
  
    body {
      background-color: #b9fefe;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      color: #333;
    }

    select, button {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }

    .result {
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
    }

    img {
      width: 200px;
      border-radius: 10px;
      margin: 10px;
      transition: transform 0.3s;
    }

    img:hover {
      transform: scale(1.1); 
    }
  </style>
</head>
<body>

  <h1> Can You Guess What's My Favorite?</h1>

  <hr />
  <!-- 🎨 Favorite Color Question -->
  <form id="color-form">
    <label>
       What is my favorite color 🧐?
      <select id="color-answer">
        <option value="pink">Pink</option>
        <option value="blue">Blue</option>
        <option value="green">Green</option>
        <option value="purple">Purple</option>
      </select>
    </label>
    <button type="submit">Check Color</button>
  </form>
  <div class="result" id="color-result"></div>

  <hr />
  <!-- 🧸 Favorite Cartoon Character Question -->
  <form id="character-form">
    <label>
       Who is my favorite cartoon character 🤨?
      <select id="character-answer">
        <option value="spongebob">SpongeBob</option>
        <option value="bubbles">Bubbles (Powerpuff Girls)</option>
        <option value="dora">Dora</option>
        <option value="mickey">Mickey Mouse</option>
      </select>
    </label>
    <button type="submit">Check Character</button>
  </form>
  <div class="result" id="character-result"></div>

  <hr />
  <!-- ✅ 3 Fun Images -->
  <h2>Which One?</h2>
  <img src="https://cdn.glitch.global/a3822bda-d3b8-4161-aa51-415bc8db2b42/Image%201.jpeg?v=1750029330653" alt="SpongeBob">
  <img src="https://cdn.glitch.global/a3822bda-d3b8-4161-aa51-415bc8db2b42/Image.jpeg?v=1750029311773" alt="Bubbles">
  <img src="https://www.cleveland.com/resizer/v2/https%3A%2F%2Fadvancelocal-adapter-image-uploads.s3.amazonaws.com%2Fimage.cleveland.com%2Fhome%2Fcleve-media%2Fwidth2048%2Fimg%2Ftv_blog%2Fphoto%2Fdora-explorerjpg-3d1163555ccbdd6e.jpg?auth=07bb32e47f8bb7e6d30464d759d76bb423506189a150223973c828c7e49525ca&width=1280&quality=90" alt="Dora">

  <script>
    // ✅ Animation Method 1: fadeIn()
    $("#color-form").on("submit", function (event) {
      event.preventDefault();
      var answer = $("#color-answer").val();
      if (answer === "teal") {
        $("#color-result").hide().text("Correct! Teal is my all time fav color!  ").fadeIn(800);
      } else {
        $("#color-result").hide().text("Nope! Try again!").fadeIn(800);
      }
    });

    // ✅ Animation Method 2: slideDown()
    $("#character-form").on("submit", function (event) {
      event.preventDefault();
      var answer = $("#character-answer").val();
      if (answer === "bubbles") {
        $("#character-result").hide().text("YES! I love Bubbles 💙 shes my fav power puff!!").slideDown(800);
      } else {
        $("#character-result").hide().text("You don't know me at all..").slideDown(800);
      }
    });

    // ✅ Extra Feature: .mouseover()
    $("img").mouseover(function () {
      $(this).css("box-shadow", "0 0 15px hotpink");
    }).mouseout(function () {
      $(this).css("box-shadow", "none");
    });
  </script>

</body>
</html>
